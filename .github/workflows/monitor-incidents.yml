name: Monitor Bucks County 911
on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'
permissions:
  contents: write
concurrency:
  group: bucks-county-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Check public report and send new incidents
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
      - name: Save seen IDs to repository
        if: success()
        run: |
          if [[ -n "$(git status --porcelain -- seen_incidents.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_incidents.json
            git commit -m "Update seen Bucks County incident IDs [skip ci]"
            git push
          fi
